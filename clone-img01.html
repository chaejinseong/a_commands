<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카테고리 갤러리</title>
<style>
  :root { --bg:#fff; --fg:#222; --sub:#888; --accent:#00b5b5; --tile:#f2f3f5; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111; --fg:#eee; --sub:#999; --accent:#2ee0e0; --tile:#222; } }
  :root[data-theme="dark"] { --bg:#111; --fg:#eee; --sub:#999; --accent:#2ee0e0; --tile:#222; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 13px/1.3 system-ui, "Apple SD Gothic Neo", sans-serif; }

  nav { display: flex; gap: 28px; justify-content: center; padding: 20px 16px 24px; overflow-x: auto; }
  nav a { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--fg); text-decoration: none; white-space: nowrap; }
  nav a .ico { font-size: 18px; line-height: 1; }
  nav a.on { color: var(--accent); }
  nav .sep { width: 1px; background: var(--tile); }

  .grid { display: flex; gap: 20px; overflow-x: auto; padding: 0 16px 24px; }
  .card { flex: 0 0 auto; width: 280px; }
  .thumb { height: 282px; border-radius: 6px; background: var(--tile); }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; color: var(--sub); }
  .author { display: flex; align-items: center; gap: 8px; color: var(--fg); font-weight: 600; }
  .avatar { width: 20px; height: 20px; border-radius: 50%; background: var(--tile); display: inline-block; }
  .stats span { margin-left: 10px; }

  .t1 { background: linear-gradient(90deg, #111 0 50%, #444 50%); }
  .t2 { background: radial-gradient(circle at 30% 30%, #fff 0 4%, transparent 5%), linear-gradient(#e5246b, #b5144c); }
  .t3 { background: linear-gradient(160deg, #d8d4c5 0 40%, #7b8f5a 40%); }
  .t4 { background: #000; }
  .t5 { background: linear-gradient(#5b8bb5, #2b5f86); }
  .t6 { background: linear-gradient(#4a6a52, #1f3a2c); }
</style>
</head>
<body>
  <nav>
    <a class="on" href="#"><span class="ico">◈</span>전체</a>
    <a href="#"><span class="ico">▶</span>영상/모션그래픽</a>
    <a href="#"><span class="ico">🎨</span>그래픽 디자인</a>
    <a href="#"><span class="ico">🪪</span>브랜딩/편집</a>
    <a href="#"><span class="ico">◉</span>UI/UX</a>
    <a href="#"><span class="ico">✎</span>일러스트레이션</a>
    <a href="#"><span class="ico">▣</span>디지털 아트</a>
    <a href="#"><span class="ico">✦</span>AI</a>
    <a href="#"><span class="ico">🐻</span>캐릭터 디자인</a>
    <a href="#"><span class="ico">▤</span>제품/패키지 디자인</a>
    <a href="#"><span class="ico">📷</span>포토그래피</a>
    <a href="#"><span class="ico">T</span>타이포그래피</a>
    <a href="#"><span class="ico">◆</span>공예</a>
    <a href="#"><span class="ico">🖌</span>파인아트</a>
    <span class="sep"></span>
    <a href="#"><span class="ico">▲</span>경기도 AI 콘텐츠</a>
  </nav>

  <section class="grid">
    <article class="card">
      <div class="thumb t1"></div>
      <div class="meta"><span class="author"><i class="avatar"></i>Hi high studio Hah Kim</span><span class="stats">👁 191<span>♥ 9</span></span></div>
    </article>
    <article class="card">
      <div class="thumb t2"></div>
      <div class="meta"><span class="author"><i class="avatar"></i>25min</span><span class="stats">👁 196<span>♥ 2</span></span></div>
    </article>
    <article class="card">
      <div class="thumb t3"></div>
      <div class="meta"><span class="author"><i class="avatar"></i>시나브</span><span class="stats">👁 192<span>♥ 2</span></span></div>
    </article>
    <article class="card">
      <div class="thumb t4"></div>
      <div class="meta"><span class="author"><i class="avatar"></i>모래</span><span class="stats">👁 182<span>♥ 9</span></span></div>
    </article>
    <article class="card">
      <div class="thumb t5"></div>
      <div class="meta"><span class="author"><i class="avatar"></i>홍희정</span><span class="stats">👁 159<span>♥ 6</span></span></div>
    </article>
    <article class="card">
      <div class="thumb t6"></div>
      <div class="meta"><span class="author"><i class="avatar"></i>인몰드</span><span class="stats">👁 247<span>♥ 11</span></span></div>
    </article>
  </section>
</body>
</html>
